name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # Unlike the iOS SDK, this needs no special host: it's a plain JVM/Gradle
    # build, and Robolectric runs the Android framework classes the unit
    # tests touch entirely on the JVM — no emulator/device needed for this
    # test suite (there are no instrumented/androidTest sources here, only
    # sdk/src/test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run tests
        run: ./gradlew :sdk:testDebugUnitTest --rerun
